name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: docker build -t eqt-live .
      - name: Smoke test container
        run: |
          docker run -d -p 7860:7860 --name eqt eqt-live
          ok=0
          for i in $(seq 1 45); do
            if curl -fs localhost:7860/health | grep -q '"models_loaded":true'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then echo "health check failed"; docker logs eqt; exit 1; fi
          curl -fs localhost:7860/ | grep -q 'id="root"' || { echo "frontend not served"; docker logs eqt; exit 1; }

  deploy:
    concurrency:
      group: cloud-run-deploy
      cancel-in-progress: true
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless auth to Google Cloud (Workload Identity Federation)
    env:
      PROJECT_ID: gen-lang-client-0309165003
      REGION: us-central1
      SERVICE: eqt-live
      IMAGE: us-central1-docker.pkg.dev/gen-lang-client-0309165003/eqt-live/eqt-live:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/313854684807/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@gen-lang-client-0309165003.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" --image "${IMAGE}" \
            --service-account "eqt-live-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --port 7860 --cpu 1 --memory 2Gi --concurrency 10 --timeout 120 \
            --min-instances 0 --max-instances 2 \
            --allow-unauthenticated --quiet
      - name: Smoke test the live service
        run: |
          url=$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')
          echo "Live at ${url}"
          curl -fs --retry 5 --retry-delay 10 "${url}/health" | grep -q '"models_loaded":true'
