name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: docker build -t eqt-live .
      - name: Smoke test container
        run: |
          docker run -d -p 7860:7860 --name eqt eqt-live
          ok=0
          for i in $(seq 1 45); do
            if curl -fs localhost:7860/health | grep -q '"models_loaded":true'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then echo "health check failed"; docker logs eqt; exit 1; fi
          curl -fs localhost:7860/ | grep -q 'id="root"' || { echo "frontend not served"; docker logs eqt; exit 1; }

  deploy:
    concurrency:
      group: hf-deploy
      cancel-in-progress: true
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "${HF_TOKEN}" ] || [ -z "${HF_SPACE}" ]; then
            echo "::error::HF_TOKEN secret and HF_SPACE variable must both be set"
            exit 1
          fi
          git lfs install
          git lfs fetch --all origin
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
